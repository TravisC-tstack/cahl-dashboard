<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="CAHL Dashboard — live scores, league standings, team and player stats, and analytics for beer-league hockey." />
  <meta name="theme-color" content="#070b12" />
  <script>
    // Set theme before first paint to avoid a flash of the wrong mode.
    // Dark is the native "rink night" default for a live-scores product;
    // first-time visitors with no saved preference get dark unless their
    // OS explicitly requests light.
    (function () {
      var t = localStorage.getItem('cahl-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#070b12' : '#f4f7fb');
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CAHL" />
  <title>CAHL Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Saira+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/static/img/chiller-logo-3d.svg" />
  <link rel="apple-touch-icon" href="/static/img/icon-192.png" />
  <link rel="manifest" href="/static/manifest.json" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CAHL Dashboard" />
  <meta property="og:description" content="Live scores, standings, rosters, and all-time player stats for Chiller Adult Hockey League." />
  <meta property="og:url" content="https://cahl.neural-forge.io" />
  <meta property="og:image" content="https://cahl.neural-forge.io/static/img/icon-512.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="CAHL Dashboard" />
  <meta name="twitter:description" content="Live scores, standings, rosters, and all-time player stats for Chiller Adult Hockey League." />
  <meta name="twitter:image" content="https://cahl.neural-forge.io/static/img/icon-512.png" />
  <link rel="stylesheet" href="/static/css/style.css?v=49" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="a11y-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" class="toast" role="status"></div>

  <div id="kpalOv" class="pal-ov" aria-hidden="true">
    <div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="pal-input-row">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="kpalQ" type="text" placeholder="Search players, teams, pages…" autocomplete="off" spellcheck="false" aria-label="Search players, teams, pages">
        <span class="pal-esc">esc</span>
      </div>
      <div id="kpalList" class="pal-list" role="listbox" aria-label="Results"></div>
      <div class="pal-foot">
        <span><kbd>↑↓</kbd>navigate</span>
        <span><kbd>↵</kbd>open</span>
        <span><kbd>⌘K</kbd>toggle</span>
      </div>
    </div>
  </div>

  <div id="app">
    <header role="banner">
      <h1>
        <a id="brandHome" class="brand-home" href="#" aria-label="CAHL Dashboard — go to Today's games">
          <img src="/static/img/chiller-logo-3d.svg" alt="OhioHealth Chiller Ice Rinks" class="brand-logo" />
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 4.5l4.8 4.8a4 4 0 0 0 2.83 1.17H14l7 7.5" />
            <path d="M14 21h5.5" />
            <circle cx="6.5" cy="18.5" r="2.5" />
          </svg>
          <span class="brand-text">CAHL<span class="brand-accent"> Dashboard</span></span>
        </a>
      </h1>
      <div class="controls">
        <span id="verBadge" class="ver-badge" title="App version" hidden>v</span>
        <button id="kpalBtn" class="kpal-btn" aria-label="Open command palette (Cmd+K)" title="Search everything (⌘K)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="kpal-txt">Search…</span>
          <kbd>⌘K</kbd>
        </button>
        <button id="themeToggle" class="ghost small" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <button id="refreshBtn" class="ghost small" title="Refresh latest scores and stats" aria-label="Refresh latest scores and stats">Refresh</button>
        <label class="switch" title="Toggle live auto-refresh">
          <input type="checkbox" id="autoToggle" aria-label="Toggle live auto-refresh" />
          <span class="toggle"></span>
          <span>Live</span>
        </label>
        <span class="live-dot" title="Game in progress — scores auto-refreshing every 30s"></span>
      </div>
    </header>

    <main id="main" role="main" tabindex="-1"></main>

    <nav role="navigation" aria-label="Primary">
      <a href="#" class="nav-link active" data-tab="today" aria-label="Today's games" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Today
      </a>
      <a href="#" class="nav-link" data-tab="league" aria-label="League standings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/><line x1="6" y1="4" x2="18" y2="4"/></svg>
        League
      </a>
      <a href="#" class="nav-link" data-tab="team" aria-label="Team stats">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Team
      </a>
      <a href="#" class="nav-link" data-tab="players" aria-label="Player stats">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Players
      </a>
      <a href="#" class="nav-link" data-tab="analytics" aria-label="Analytics">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Analytics
      </a>
    </nav>
  </div>

  <script>window.APP_VERSION = 43;</script>
  <script src="/static/js/app.js?v=49"></script>
</body>
</html>
